<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML إلى فيديو</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f1f4;margin:0;min-height:100vh;display:grid;place-items:center;color:#4b2637}
.card{width:min(92vw,620px);background:#fff;padding:32px;border-radius:24px;box-shadow:0 18px 60px #0001}
h1{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;margin:12px 0 6px;font-size:14px}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}
button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:12px;background:#a72d5f;color:white;font-size:16px;cursor:pointer}
#status{margin-top:16px;white-space:pre-wrap}
</style>
</head>
<body><main class="card">
<h1>تحويل HTML إلى فيديو 🎥</h1>
<p>ارفع ملف HTML وسيتم تشغيله في Chromium وتصديره كـ MP4.</p>
<form id="f">
<label>ملف HTML</label><input type="file" name="html" accept=".html,text/html" required>
<div class="row">
<div><label>المدة (ثانية)</label><input name="duration" type="number" value="10" min="3" max="30"></div>
<div><label>FPS</label><input name="fps" type="number" value="30" min="15" max="30"></div>
</div>
<div class="row">
<div><label>العرض</label><input name="width" type="number" value="1080"></div>
<div><label>الارتفاع</label><input name="height" type="number" value="1920"></div>
</div>
<button>إنشاء الفيديو</button><div id="status"></div>
</form>
<script>
f.onsubmit=async e=>{e.preventDefault();status.textContent="جاري إنشاء الفيديو... قد يستغرق عدة دقائق.";
const r=await fetch("/render",{method:"POST",body:new FormData(f)});
if(r.ok){const b=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="html-render.mp4";a.click();status.textContent="تم إنشاء الفيديو."}
else{status.textContent="حدث خطأ: "+await r.text()}}
</script>
</main></body></html>
