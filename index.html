<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حقيبة خرز وردية ثلاثية الأبعاد</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Tahoma", Arial, sans-serif;
      background: radial-gradient(circle at 50% 15%, #fff 0%, #f4eff3 45%, #ddd5da 100%);
      color: #7b1745;
    }
    #scene { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; }
    .header {
      position: fixed; top: clamp(18px, 4vw, 42px); right: clamp(18px, 5vw, 70px);
      z-index: 5; pointer-events: none; text-align: right;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 9px; font-size: 11px;
      letter-spacing: 2.2px; color: #bd5b82; text-transform: uppercase; margin-bottom: 10px;
    }
    .eyebrow::before { content: ""; width: 30px; height: 1px; background: #c23c70; }
    h1 { margin: 0; font-size: clamp(25px, 4.2vw, 50px); font-weight: 500;
      letter-spacing: -.8px; text-shadow: 0 2px 12px rgba(255,255,255,.9); }
    .header p { margin: 8px 0 0; font-size: clamp(12px, 1.4vw, 16px); color: #95647a; }
    .info {
      position: fixed; bottom: clamp(18px, 4vw, 42px); right: clamp(18px, 5vw, 70px);
      z-index: 5; padding: 13px 17px; background: rgba(255,255,255,.5);
      border: 1px solid rgba(210,102,143,.25); border-radius: 50px; color: #9a4c6d;
      font-size: 13px; box-shadow: 0 9px 30px rgba(116,51,77,.08);
      backdrop-filter: blur(9px); transition: opacity .4s ease;
    }
    .dot { display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%;
      background: #e4377a; box-shadow: 0 0 0 4px rgba(228,55,122,.13); animation: pulse 1.8s infinite; }
    .badge { position: fixed; bottom: clamp(20px, 4vw, 43px); left: clamp(18px, 5vw, 70px);
      z-index: 5; direction: ltr; font-size: 10px; letter-spacing: 2px; color: rgba(130,65,88,.56); }
    @keyframes pulse { 50% { transform: scale(1.45); opacity: .55; } }
    @media (max-width: 600px) {
      .header { right: 22px; top: 25px; }
      .info { right: 18px; left: 18px; bottom: 20px; text-align: center; }
      .badge { display: none; }
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div class="header">
    <div class="eyebrow">BEADED COLLECTION</div>
    <h1>حقيبة الكريستال الوردية</h1>
    <p>تصميم خرزي شفاف بتدرجات وردية لامعة</p>
  </div>
  <div class="info"><span class="dot"></span>اسحب لتدوير الحقيبة · مرّر للتكبير</div>
  <div class="badge">HANDCRAFTED · 3D STUDY</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';
    const mount = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xf2edf0, 13, 24);
    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.2, 4.0, 11.7);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    mount.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, .1, 0); controls.enableDamping = true; controls.dampingFactor = .055;
    controls.minDistance = 7; controls.maxDistance = 17; controls.maxPolarAngle = Math.PI * .58;
    controls.minPolarAngle = Math.PI * .25; controls.autoRotate = true; controls.autoRotateSpeed = .45;
    const hemi = new THREE.HemisphereLight(0xfff8fc, 0x8a5061, 2.6); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffe8f1, 4.2); key.position.set(-5, 8, 7);
    key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8; scene.add(key);
    const sideLight = new THREE.PointLight(0xec2e73, 16, 12, 2); sideLight.position.set(5, 2.5, 3); scene.add(sideLight);
    const rim = new THREE.PointLight(0xffffff, 11, 13, 2); rim.position.set(-5, 4, -4); scene.add(rim);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0xf5eef1, roughness: .76, metalness: 0 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -3.2; floor.receiveShadow = true; scene.add(floor);
    const bag = new THREE.Group(); bag.position.y = .12; scene.add(bag);
    const beadGeo = new THREE.SphereGeometry(.145, 14, 10);
    const beadMat = new THREE.MeshPhysicalMaterial({ color: 0xff4d91, roughness: .13, metalness: .02,
      transmission: .18, thickness: .45, transparent: true, opacity: .9, clearcoat: 1,
      clearcoatRoughness: .08, vertexColors: true });
    const pink = new THREE.Color('#e8276f'), rose = new THREE.Color('#f1689d'),
      pale = new THREE.Color('#ffd7e8'), crystal = new THREE.Color('#fff6fa');
    const tmp = new THREE.Object3D();
    function instancedBeads(points, material, colorFunction) {
      const mesh = new THREE.InstancedMesh(beadGeo, material, points.length);
      mesh.castShadow = true; mesh.receiveShadow = true;
      points.forEach((p, i) => {
        tmp.position.copy(p); tmp.scale.setScalar(.93 + (i % 7) * .015); tmp.updateMatrix();
        mesh.setMatrixAt(i, tmp.matrix); mesh.setColorAt(i, colorFunction ? colorFunction(p, i) : pink);
      });
      mesh.instanceMatrix.needsUpdate = true; if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      bag.add(mesh); return mesh;
    }
    const W = 5.9, H = 4.35, D = .72, step = .265;
    const front = [], back = [], sides = [];
    for (let y = -H/2; y <= H/2 + .01; y += step) for (let x = -W/2; x <= W/2 + .01; x += step) {
      const stagger = (Math.round((y + H/2) / step) % 2) * step * .5;
      if (x + stagger <= W/2) { front.push(new THREE.Vector3(x + stagger, y, D/2)); back.push(new THREE.Vector3(x + stagger, y, -D/2)); }
    }
    for (let y = -H/2; y <= H/2 + .01; y += step) for (let z = -D/2 + .05; z <= D/2; z += step)
      sides.push(new THREE.Vector3(-W/2, y, z), new THREE.Vector3(W/2, y, z));
    function bodyColor(p) { const v = (p.y + H / 2) / H; if (v > .67) return crystal.clone().lerp(pale, (v - .67) * 1.5); return rose.clone().lerp(pink, 1 - v * .7); }
    instancedBeads(front, beadMat, bodyColor); instancedBeads(back, beadMat, p => bodyColor(p).multiplyScalar(.85));
    instancedBeads(sides, beadMat, p => bodyColor(p).lerp(pink, .25));
    const edge = [];
    for (let x = -W/2; x <= W/2; x += step) { edge.push(new THREE.Vector3(x, H/2 + .03, D/2 + .01)); edge.push(new THREE.Vector3(x, H/2 + .03, -D/2 - .01)); }
    instancedBeads(edge, beadMat, () => pink);
    const flap = [];
    for (let r = 0; r < 8; r++) {
      const yy = H/2 + .12 - r * step, half = W/2 - .18 - r * .30; if (half < .1) break;
      for (let x = -half; x <= half; x += step) flap.push(new THREE.Vector3(x, yy, D/2 + .18 + r*.012));
    }
    instancedBeads(flap, beadMat, (p, i) => rose.clone().lerp(pink, (i % 6) / 10));
    const flower = [], center = new THREE.Vector3(0, .65, .70); flower.push(center);
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; flower.push(new THREE.Vector3(Math.cos(a) * .22, .65 + Math.sin(a) * .22, .69)); }
    instancedBeads(flower, beadMat, () => new THREE.Color('#d91361'));
    const chainCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-W/2-.04, H/2+.1, .08), new THREE.Vector3(-4.05, 1.35, .0),
      new THREE.Vector3(-4.3, -2.6, .25), new THREE.Vector3(-2.8, -3.05, 1.6),
      new THREE.Vector3(0, -3.25, 2.15), new THREE.Vector3(2.8, -3.17, 1.55),
      new THREE.Vector3(4.15, -2.6, .2), new THREE.Vector3(4.02, 1.25, -.04),
      new THREE.Vector3(W/2+.04, H/2+.1, .08)
    ], false, 'catmullrom', .22);
    const strapPoints = chainCurve.getPoints(180), strapGeo = new THREE.SphereGeometry(.12, 12, 9);
    const strap = new THREE.InstancedMesh(strapGeo, beadMat, strapPoints.length); strap.castShadow = true;
    strapPoints.forEach((p, i) => { tmp.position.copy(p); tmp.scale.setScalar(.94 + Math.sin(i * 1.71) * .04); tmp.updateMatrix();
      strap.setMatrixAt(i, tmp.matrix); strap.setColorAt(i, new THREE.Color('#ef77a7').lerp(new THREE.Color('#ffc2da'), (i % 9) / 15)); });
    strap.instanceMatrix.needsUpdate = true; strap.instanceColor.needsUpdate = true; bag.add(strap);
    const inner = new THREE.Mesh(new THREE.BoxGeometry(W-.22, H-.24, D-.15),
      new THREE.MeshPhysicalMaterial({ color: 0xffb4cf, transparent: true, opacity: .08, roughness: .2, transmission: .25, side: THREE.DoubleSide }));
    inner.position.z = -.02; bag.add(inner);
    const glow = new THREE.Mesh(new THREE.CircleGeometry(4.3, 64),
      new THREE.MeshBasicMaterial({ color: 0xf49abb, transparent: true, opacity: .10, depthWrite: false }));
    glow.rotation.x = -Math.PI / 2; glow.position.set(0, -3.17, .4); glow.scale.y = .33; scene.add(glow);
    let dragging = false;
    renderer.domElement.addEventListener('pointerdown', () => { dragging = true; controls.autoRotate = false; });
    addEventListener('pointerup', () => { dragging = false; setTimeout(() => controls.autoRotate = true, 1800); });
    renderer.domElement.addEventListener('wheel', () => { controls.autoRotate = false; setTimeout(() => controls.autoRotate = true, 1500); }, { passive: true });
    let time = 0;
    function animate() {
      requestAnimationFrame(animate); time += .008;
      if (!dragging) { bag.position.y = .12 + Math.sin(time) * .035; glow.material.opacity = .09 + Math.sin(time * 1.4) * .018; }
      controls.update(); renderer.render(scene, camera);
    }
    animate();
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
